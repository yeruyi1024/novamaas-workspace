name: Build, package and publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'

jobs:
  backend:
    name: Go checks
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify CI image tag formatter
        run: |
          test "$(bash .github/scripts/resolve-build-tag.sh 2026-09-06T08:11:40Z amd64)" = "build_20260906T081140Z_amd64"
          test "$(bash .github/scripts/resolve-build-tag.sh 2026-09-06T08:11:40Z arm64)" = "build_20260906T081140Z_arm64"
          test "$(bash .github/scripts/resolve-build-tag.sh 2026-09-06T08:11:40Z multiarch)" = "build_20260906T081140Z_multiarch"
          if bash .github/scripts/resolve-build-tag.sh 2026-09-06T08:11:40+08:00 amd64; then
            echo "Expected a non-UTC timestamp to fail." >&2
            exit 1
          fi
          if bash .github/scripts/resolve-build-tag.sh 2026-09-06T08:11:40Z s390x; then
            echo "Expected an unsupported architecture to fail." >&2
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Prepare embed path for static checks
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - run: go vet ./...
      - run: go build ./...
      - name: Check relaykit independently
        working-directory: relaykit
        run: |
          go vet ./...
          go build ./...
      - run: make test

  frontend:
    name: Frontend checks
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  build:
    name: Package Linux ${{ matrix.arch }}
    needs: [backend, frontend]
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      MERGED_AT: ${{ github.event.pull_request.merged_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve version and image name
        id: version
        run: |
          base_version=$(cat VERSION)
          image_tag=$(bash .github/scripts/resolve-build-tag.sh "$MERGED_AT" "$ARCH")
          version="${base_version}-dev.${GITHUB_SHA:0:12}"
          [[ "$version" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          test "${#image_tag}" -le 128
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image with embedded frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: novamaas-ci:local
          labels: |
            org.opencontainers.image.title=NovaMaaS Workspace
            org.opencontainers.image.description=Localized fork of QuantumNous/new-api v1.0.0-rc.26
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=linux-${{ matrix.arch }},ignore-error=true
      - name: Verify version and HTTP startup
        run: bash .github/scripts/verify-image.sh novamaas-ci:local "$BUILD_VERSION"
      - name: Package the tested binary and notices
        run: |
          package="novamaas-${BUILD_VERSION}-linux-${ARCH}"
          mkdir -p "dist/$package"
          container=$(docker create novamaas-ci:local)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/new-api" "dist/$package/new-api"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md UPSTREAM.md VERSION "dist/$package/"
          cp docs/BUILD.zh_CN.md "dist/$package/BUILD.zh_CN.md"
          printf 'repository=%s\ncommit=%s\nupstream=%s\nversion=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            '8f6961c675932f406260ff0c218bc2aa0603e9b2' "$BUILD_VERSION" \
            > "dist/$package/BUILD-INFO.txt"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested GHCR image
        run: |
          ghcr_ref="${IMAGE}:${IMAGE_TAG}"
          docker tag novamaas-ci:local "$ghcr_ref"
          docker push "$ghcr_ref"
          mkdir -p digests
          ghcr_digest=$(docker buildx imagetools inspect "$ghcr_ref" --format '{{.Manifest.Digest}}')
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMAGE" "$ghcr_digest" > "digests/ghcr-$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: build
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      MERGED_AT: ${{ github.event.pull_request.merged_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Resolve image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          image_tag=$(bash .github/scripts/resolve-build-tag.sh "$MERGED_AT" multiarch)
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and verify GHCR manifest
        id: manifest
        run: |
          ghcr_ref="${IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools create --tag "$ghcr_ref" "$(cat digests/ghcr-amd64)" "$(cat digests/ghcr-arm64)"
          docker buildx imagetools inspect "$ghcr_ref" --raw > ghcr-manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' ghcr-manifest.json
          digest=$(docker buildx imagetools inspect "$ghcr_ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '### Published GHCR image\n\n- `%s`\n\n' "$ghcr_ref" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Pinned reference: `%s@%s`\n\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$ghcr_ref" >> "$GITHUB_STEP_SUMMARY"

  publish-ccr-amd64:
    name: Publish Tencent CCR Linux amd64
    needs: [backend, frontend]
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: [self-hosted, Linux, X64, novamaas-image]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MERGED_AT: ${{ github.event.pull_request.merged_at }}
    steps:
      - name: Check out the merged commit with retries
        run: |
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [[ ! -d .git ]]; then
            git init
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$repository_url"
          else
            git remote add origin "$repository_url"
          fi
          git config --local gc.auto 0
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
          fi
          git clean -ffdx

          fetched=false
          for attempt in 1 2 3; do
            if timeout 120 git -c http.version=HTTP/1.1 fetch \
              --no-tags --prune --no-recurse-submodules --depth=1 \
              origin "+${GITHUB_SHA}:refs/remotes/origin/ci-build"; then
              fetched=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 10))
              echo "Fetch attempt $attempt failed; retrying in ${delay}s." >&2
              sleep "$delay"
            fi
          done
          if [[ "$fetched" != true ]]; then
            echo "Failed to fetch $GITHUB_SHA after 3 attempts." >&2
            exit 1
          fi

          git checkout --detach --force "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clean -ffdx
      - name: Isolate Docker credentials for this job
        run: |
          docker_config="$RUNNER_TEMP/novamaas-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - name: Resolve version and Tencent CCR image name
        run: |
          base_version=$(cat VERSION)
          image_tag=$(bash .github/scripts/resolve-build-tag.sh "$MERGED_AT" amd64)
          version="${base_version}-dev.${GITHUB_SHA:0:12}"
          [[ "$version" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          test "${#image_tag}" -le 128
          printf '%s\n' "$version" > VERSION
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "CCR_IMAGE=ccr.ccs.tencentyun.com/nova-proj/nova-maas" >> "$GITHUB_ENV"
      - name: Verify Docker tooling
        run: |
          docker version
          docker buildx version
          test "$(docker buildx inspect default --format '{{.Driver}}')" = docker
      - name: Build image on self-hosted runner
        run: |
          docker buildx build \
            --builder default \
            --platform linux/amd64 \
            --load \
            --tag novamaas-ccr:local \
            --build-arg GOPROXY=https://goproxy.cn,direct \
            --label "org.opencontainers.image.title=NovaMaaS Workspace" \
            --label "org.opencontainers.image.description=Localized fork of QuantumNous/new-api v1.0.0-rc.26" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${BUILD_VERSION}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0" \
            .
      - name: Verify version and HTTP startup
        run: bash .github/scripts/verify-image.sh novamaas-ccr:local "$BUILD_VERSION"
      - name: Configure Tencent CCR credentials
        env:
          REGISTRY: ccr.ccs.tencentyun.com
          REGISTRY_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: bash .github/scripts/configure-docker-registry-auth.sh
      - name: Push tested image directly to Tencent CCR
        run: |
          ref="${CCR_IMAGE}:${IMAGE_TAG}"
          architecture=$(docker image inspect novamaas-ccr:local --format '{{.Architecture}}')
          test "$architecture" = amd64
          docker tag novamaas-ccr:local "$ref"
          docker push "$ref"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '### Published Tencent CCR image\n\n- `%s`\n- Pinned reference: `%s@%s`\n' \
            "$ref" "$CCR_IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Verify published image ${{ matrix.arch }}
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull anonymously and verify published image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST}"
          # A fresh runner without registry login verifies public pull access.
          docker pull "$ref"
          revision=$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"
          bash .github/scripts/verify-image.sh "$ref" "$EXPECTED_VERSION"
