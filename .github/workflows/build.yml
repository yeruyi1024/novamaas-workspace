name: Build, package and publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Prepare embed path for static checks
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - run: go vet ./...
      - run: go build ./...
      - name: Check relaykit independently
        working-directory: relaykit
        run: |
          go vet ./...
          go build ./...
      - run: make test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  build:
    name: Package Linux ${{ matrix.arch }}
    needs: [backend, frontend]
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      CAN_PUBLISH: ${{ github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve version and image name
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          base_version=$(cat VERSION)
          image_tag="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="$RELEASE_TAG"
            image_tag="$RELEASE_TAG"
            if [[ "$version" != "$base_version" ]]; then
              echo "::error::Release tag must match VERSION ($base_version)."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            test "$version" = "$base_version"
          else
            version="${base_version}-dev.${GITHUB_SHA:0:12}"
          fi
          # Release tags must also be valid, unmodified Docker tags.
          [[ "$version" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          test "${#image_tag}" -le 128
          printf '%s\n' "$version" > VERSION
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image with embedded frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: novamaas-ci:local
          labels: |
            org.opencontainers.image.title=NovaMaaS Workspace
            org.opencontainers.image.description=Localized fork of QuantumNous/new-api v1.0.0-rc.26
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Verify version and HTTP startup
        run: bash .github/scripts/verify-image.sh novamaas-ci:local "$BUILD_VERSION"
      - name: Package the tested binary and notices
        run: |
          package="novamaas-${BUILD_VERSION}-linux-${ARCH}"
          mkdir -p "dist/$package"
          container=$(docker create novamaas-ci:local)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/new-api" "dist/$package/new-api"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md UPSTREAM.md VERSION "dist/$package/"
          cp docs/BUILD.zh_CN.md "dist/$package/BUILD.zh_CN.md"
          printf 'repository=%s\ncommit=%s\nupstream=%s\nversion=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            '8f6961c675932f406260ff0c218bc2aa0603e9b2' "$BUILD_VERSION" \
            > "dist/$package/BUILD-INFO.txt"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Log in to GHCR
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        if: env.CAN_PUBLISH == 'true'
        run: |
          ref="${IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag novamaas-ci:local "$ref"
          docker push "$ref"
          mkdir -p digests
          docker inspect --format '{{index .RepoDigests 0}}' "$ref" > "digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.CAN_PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: build
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and verify manifest
        id: manifest
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ref="${IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools create --tag "$ref" "$(cat digests/amd64)" "$(cat digests/arm64)"
          docker buildx imagetools inspect "$ref" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\n- `%s`\n\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Pinned reference: `%s@%s`\n\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$ref" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Verify published image ${{ matrix.arch }}
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull anonymously and verify published image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST}"
          # A fresh runner without registry login verifies public pull access.
          docker pull "$ref"
          revision=$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"
          bash .github/scripts/verify-image.sh "$ref" "$EXPECTED_VERSION"

  mirror-tencent:
    name: Mirror multi-arch image to Tencent CCR
    needs: [build, publish, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      SOURCE_DIGEST: ${{ needs.publish.outputs.digest }}
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}
      TENCENT_CCR_IMAGE: ccr.ccs.tencentyun.com/itcode/novamaas
      TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com
    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Log in to Tencent CCR
        env:
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
        run: |
          if [[ -z "$TENCENT_CCR_USERNAME" || -z "$TENCENT_CCR_PASSWORD" ]]; then
            echo '::error::TENCENT_CCR_USERNAME and TENCENT_CCR_PASSWORD repository secrets are required.'
            exit 1
          fi
          printf '%s' "$TENCENT_CCR_PASSWORD" | skopeo login \
            --username "$TENCENT_CCR_USERNAME" \
            --password-stdin "$TENCENT_CCR_REGISTRY"
      - name: Copy and verify multi-arch image
        id: mirror
        run: |
          source_ref="docker://${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          target_ref="docker://${TENCENT_CCR_IMAGE}:${IMAGE_TAG}"
          skopeo copy --all --retry-times 5 "$source_ref" "$target_ref"
          skopeo inspect --raw "$target_ref" > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          digest=$(skopeo inspect "$target_ref" | jq -er '.Digest | select(test("^sha256:[0-9a-f]{64}$"))')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '### Tencent CCR mirror\n\n- `%s:%s`\n\n' \
            "$TENCENT_CCR_IMAGE" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Pinned reference: `%s@%s`\n' \
            "$TENCENT_CCR_IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Attach release packages
    needs: [verify-published, mirror-tencent]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-linux-*
          path: dist
          merge-multiple: true
      - name: Upload packages to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
